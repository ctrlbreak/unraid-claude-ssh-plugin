name: Release

# Triggered by pushing a tag of the form v<plugin-version>, e.g. v2026.05.06c.
# The tag's version (after stripping the leading v) MUST match the
# <!ENTITY version> in claude-ssh.plg — the workflow checks this and refuses
# to build if they're out of sync.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install shellcheck (for the test suite)
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: Run test suite
        run: make test

      - name: Verify tag matches plg version
        run: |
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          plg_version=$(grep -oE '<!ENTITY[[:space:]]+version[[:space:]]+"[^"]+"' claude-ssh.plg \
            | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag tag_version=$tag_version plg_version=$plg_version"
          if [ "$tag_version" != "$plg_version" ]; then
            echo "ERROR: tag '$tag' implies version '$tag_version' but claude-ssh.plg has '$plg_version'" >&2
            echo "Bump the <!ENTITY version> in claude-ssh.plg to match the tag, or re-tag." >&2
            exit 1
          fi

      - name: Build .txz
        run: make

      - name: Compute md5 and render release .plg
        run: |
          md5=$(md5sum claude-ssh.txz | awk '{print $1}')
          echo "md5=$md5"
          # Substitute __MD5__ placeholder in the .plg with the computed md5.
          sed "s/__MD5__/$md5/g" claude-ssh.plg > claude-ssh.plg.rendered
          if grep -q '__MD5__' claude-ssh.plg.rendered; then
            echo "ERROR: __MD5__ placeholder still present in rendered .plg" >&2
            exit 1
          fi
          mv claude-ssh.plg.rendered claude-ssh.plg

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          # CHANGELOG sections start with `## <version> — <date>` and the next
          # section starts with `## ` again. awk between these markers.
          notes=$(awk -v v="$tag_version" '
            $0 ~ "^## " v " " { in_section=1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="(No CHANGELOG entry found for $tag_version. See CHANGELOG.md for full history.)"
          fi
          {
            echo 'notes<<NOTES_EOF'
            echo "$notes"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            claude-ssh.plg
            claude-ssh.txz
          fail_on_unmatched_files: true
